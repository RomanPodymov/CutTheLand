name: Lua

on:
  push:
    branches: [ "main", "feature/github_actions" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
      - name: Checkout
        id: hello
        uses: actions/checkout@v4.1.6
      - name: Build
        id: world
        run: ./Util/build.sh
      - name: Check on failures
        if: (${{ success() }} || ${{ failure() }}) && (${{ steps.hello.outcome }} == 'failure' || ${{ steps.world.outcome }} == 'failure')
        run: exit 1
